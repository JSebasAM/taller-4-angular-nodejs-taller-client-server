name: Deploy Angular to GitHub Pages (Demo Mode)

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client-Angular
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client-Angular/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build Angular (GitHub Pages Demo configuration)
        run: npx ng build --configuration github-pages --base-href "/${{ github.event.repository.name }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./Client-Angular/dist/Angular-Standalone-Template/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed site
        env:
          URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          echo "Verificando $URL"
          for i in $(seq 1 12); do
            code=$(curl -s -o page.html -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ] && grep -q "<app-root" page.html; then
              echo "OK: HTTP 200 y marcador <app-root encontrado (intento $i)"
              exit 0
            fi
            echo "Intento $i/12: HTTP $code. Reintentando en 10 s..."
            sleep 10
          done
          echo "ERROR: el sitio no respondió 200 con <app-root en ~2 min"
          exit 1
